name: Release with manage-hc-docker.sh asset

on:
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Tag name (e.g., v0.0.0 or v0.0b00.0)'
        required: true
        default: 'v0.0.0'
      publish_release:
        description: 'Publish GitHub release directly (set to false for draft)'
        required: true
        type: choice
        options:
          - 'true'
          - 'false'
        default: 'true'
      build_docker:
        description: 'Build and push Docker image'
        required: true
        type: choice
        options:
          - 'true'
          - 'false'
        default: 'true'
      push_play_store:
        description: 'Upload Android AAB to Google Play as draft'
        required: true
        type: choice
        options:
          - 'true'
          - 'false'
        default: 'true'
      push_amazon_appstore:
        description: 'Upload Android APK to Amazon Appstore'
        required: true
        type: choice
        options:
          - 'true'
          - 'false'
        default: 'false'

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # Required to create releases
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Prepare assets
        run: |
          echo "Running on branch: ${{ github.ref_name }}"

          # Define asset names with the tag
          TAG="${{ github.event.inputs.tag_name }}"
          HC_VER_PATTERN='^[0-9]+\.[0-9]+(b[0-9][0-9])?$'

          HC_TAG=${TAG%.*}
          HC_TAG=${HC_TAG#v}
          HC_TAG=${HC_TAG#V}
          # test if HC_TAG is the right format
          [[ $HC_TAG =~ $HC_VER_PATTERN ]] || exit 1

          MGR_NAME="manage-hc-docker-$TAG.sh"

          # create a manager with version in the name and file
          sed "s/^\(HC_MANAGER_VERSION=\).*$/\1$TAG/" ./docker/manage-hc-docker.sh \
            > "./docker/$MGR_NAME"

          # add version artifact
          echo "TAG=$TAG" > VERSION.txt

          # update version in HC source
          sed -i 's/\(hc_version = "\)[^"]\+\(".*\)/\1'$HC_TAG'\2/' ESPHamClock/version.cpp

          # create the tars and zips
          mkdir dist
          tar -czf "dist/HC-$TAG.tar.gz" --exclude=dist .
          zip -r "dist/HC-$TAG.zip" . -x "dist/*"

          # zip file for HamClock upgrades
          zip -r "dist/ESPHamClock-V$HC_TAG.zip" ESPHamClock -x "dist/*"
          zip -r "dist/hamclock-contrib-V$HC_TAG.zip" hamclock-contrib -x "dist/*"

      - name: Build Android Release APK and AAB
        env:
          TAG: ${{ github.event.inputs.tag_name }}
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          TAG="${{ github.event.inputs.tag_name }}"
          cd android
          chmod +x gradlew

          # If keystore secret is provided, decode to temporary keystore file
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "Configuring release keystore from secrets..."
            export ANDROID_KEYSTORE_FILE="$(pwd)/release.keystore"
            printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$ANDROID_KEYSTORE_FILE"
          fi
          if [ -n "$ANDROID_KEY_ALIAS" ]; then
            export ANDROID_KEY_ALIAS="$(echo "$ANDROID_KEY_ALIAS" | tr -d '[:space:]')"
          fi

          ./gradlew assembleRelease bundleRelease

          # Clean up temporary keystore file immediately after build
          if [ -f "release.keystore" ]; then
            rm -f "release.keystore"
          fi

          # Copy generated release APK into dist directory
          cp app/build/outputs/apk/release/org.openhamclock*.apk ../dist/

          # Copy generated release AAB into dist directory with matching version naming
          AAB_SRC=$(find app/build/outputs/bundle/release/ -name "*.aab" | head -n 1)
          if [ -n "$AAB_SRC" ]; then
            APK_NAME=$(basename $(ls ../dist/org.openhamclock*.apk | head -n 1))
            AAB_NAME="${APK_NAME%.apk}.aab"
            cp "$AAB_SRC" "../dist/$AAB_NAME"
          fi

          # Copy Proguard mapping file if generated
          if [ -f app/build/outputs/mapping/release/mapping.txt ]; then
            cp app/build/outputs/mapping/release/mapping.txt ../dist/mapping.txt
          fi

          # Copy Native Debug Symbols if generated
          if [ -f app/build/outputs/native-debug-symbols/release/native-debug-symbols.zip ]; then
            cp app/build/outputs/native-debug-symbols/release/native-debug-symbols.zip ../dist/native-debug-symbols.zip
          fi

      # Prepare release notes for Google Play Store upload
      - name: Prepare Play Store Release Notes
        if: ${{ github.event_name == 'push' || inputs.push_play_store == true || inputs.push_play_store == 'true' }}
        run: |
          mkdir -p dist/whatsnew
          rm -f dist/whatsnew/*

          TAG="${{ github.event.inputs.tag_name }}"
          if [[ "$TAG" =~ [bB][0-9]+ ]] && [ -f HC_RELEASE-beta.txt ]; then
            echo "Attaching beta release notes from HC_RELEASE-beta.txt"
            cp HC_RELEASE-beta.txt dist/whatsnew/whatsnew-en-US
          elif [[ "$TAG" =~ ^[vV]?[0-9]+\.[0-9]+(\.[0-9]+)?$ ]] && [ -f HC_RELEASE-stable.txt ]; then
            echo "Attaching stable release notes from HC_RELEASE-stable.txt"
            cp HC_RELEASE-stable.txt dist/whatsnew/whatsnew-en-US
          else
            echo "Edge build or notes file not found - skipping release notes"
          fi

      # Upload the signed .aab to Google Play console (Alpha track)
      - name: Upload to Google Play Alpha Track
        if: ${{ github.event_name == 'push' || inputs.push_play_store == true || inputs.push_play_store == 'true' }}
        uses: r0adkll/upload-google-play@v1
        env:
          NODE_OPTIONS: --no-deprecation
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_STORE_JSON_KEY }}
          packageName: org.openhamclock.hamclock
          releaseFiles: dist/org.openhamclock*.aab
          tracks: alpha
          status: completed
          whatsNewDirectory: dist/whatsnew
          mappingFile: dist/mapping.txt
          debugSymbols: dist/native-debug-symbols.zip

      # Upload the signed .apk to Amazon Appstore
      - name: Upload to Amazon Appstore
        if: ${{ inputs.push_amazon_appstore == true || inputs.push_amazon_appstore == 'true' }}
        uses: galonga/upload-amazon-appstore@v1.0.2
        with:
          clientId: ${{ secrets.AMAZON_APPSTORE_CLIENT_ID }}
          clientSecret: ${{ secrets.AMAZON_APPSTORE_CLIENT_SECRET }}
          appId: ${{ secrets.AMAZON_APPSTORE_APP_ID }}
          releaseFile: dist/org.openhamclock*.apk

      - name: Create Release and Upload Asset
        env:
          GH_TOKEN: ${{ github.token }}
          PUBLISH_RELEASE: ${{ inputs.publish_release }}
        run: |
          TAG="${{ github.event.inputs.tag_name }}"
          HC_TAG=${TAG%.*}
          HC_TAG=${HC_TAG#v}
          HC_TAG=${HC_TAG#V}

          # Locate the built Android APK and AAB
          APK_PATH=$(ls dist/org.openhamclock*.apk 2>/dev/null | head -n 1)
          AAB_PATH=$(ls dist/org.openhamclock*.aab 2>/dev/null | head -n 1)

          ASSETS=(
            "docker/manage-hc-docker-$TAG.sh#Manage HamClock Docker Installs"
            "debian/install-hc-rpi#Installer for RPi and other Debian distros"
            "dist/ESPHamClock-V$HC_TAG.zip#HamClock Source Zip with version"
            "old-versions/ESPHamClock-V3.10.zip#HamClock Source Zip for ESP devices"
            "old-versions/ohb.hamclock.app_ESPHamClock-V3.10.ino.bin#HamClock ino.bin for ESP devices on OHB"
            "dist/hamclock-contrib-V$HC_TAG.zip#HamClock 3rd party contributions"
            "doc/HamClockUserGuide.pdf#HamClock User Guide"
          )

          if [ -n "$APK_PATH" ] && [ -f "$APK_PATH" ]; then
            ASSETS+=("$APK_PATH#HamClock Android APK")
          fi
          if [ -n "$AAB_PATH" ] && [ -f "$AAB_PATH" ]; then
            ASSETS+=("$AAB_PATH#HamClock Android App Bundle (Google Play)")
          fi

          EXTRA_FLAGS=()
          if [ "$PUBLISH_RELEASE" = "false" ]; then
            EXTRA_FLAGS+=(--draft)
          fi

          # Grabs files from repo tree and uploads with labels
          gh release create "$TAG" \
            "${ASSETS[@]}" \
            --title "HamClock Release: $TAG" \
            --target "${{ github.ref_name }}" \
            --generate-notes \
            "${EXTRA_FLAGS[@]}"

  docker:
    name: Build and Push Docker Image
    needs: release
    runs-on: ubuntu-latest
    if: ${{ needs.release.result == 'success' && (github.event_name == 'push' || inputs.build_docker == true || inputs.build_docker == 'true') }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and Push Multiplatform Image
        run: |
          TAG="${{ github.event.inputs.tag_name }}"
          git tag -f "$TAG"
          export TAG
          chmod +x docker/build-image.sh
          ./docker/build-image.sh -m

